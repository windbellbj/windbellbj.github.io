<!-- giscus 评论框：基于 GitHub Discussions，需在 _config.yml 配齐 repo-id / category-id 后才加载 -->
{% if site.giscus.repo-id and site.giscus.category-id %}
<div class="comment">
    <script src="https://giscus.app/client.js"
            data-repo="{{ site.giscus.repo }}"
            data-repo-id="{{ site.giscus.repo-id }}"
            data-category="{{ site.giscus.category }}"
            data-category-id="{{ site.giscus.category-id }}"
            data-mapping="{{ site.giscus.mapping }}"
            data-strict="0"
            data-reactions-enabled="{{ site.giscus.reactions-enabled }}"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="{{ site.giscus.theme }}"
            data-lang="{{ site.giscus.lang }}"
            crossorigin="anonymous"
            async>
    </script>
</div>
{% endif %}
