name: AI 新资讯抓取

on:
  schedule:
    # 每周一、周四 01:00（北京时间）执行，即 UTC 周日、周三 17:00；改频率只需修改这一行的 cron 表达式
    - cron: '0 17 * * 0,3'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '回溯天数（留空使用配置文件中的 7 天）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取并生成文章
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: |
          python scripts/ai_news_fetch.py
          # 只有本次确实生成了新文章，后续配图与提交步骤才执行
          if [ -n "$(git status --porcelain _posts)" ]; then
            echo "has_new=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Node
        if: steps.fetch.outputs.has_new == '1'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Mermaid CLI
        if: steps.fetch.outputs.has_new == '1'
        run: npm install -g @mermaid-js/mermaid-cli

      - name: 安装 Playwright 与中文字体
        if: steps.fetch.outputs.has_new == '1'
        run: |
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 生成小红书文案与封面模板
        if: steps.fetch.outputs.has_new == '1'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/xhs_build.py

      - name: 生成博客/小红书配图并回填文章
        if: steps.fetch.outputs.has_new == '1'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/assets_build.py

      - name: 提交生成的文章与配图素材
        if: steps.fetch.outputs.has_new == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts scripts/ai_news_state.json img/ai-news xhs
          if git diff --staged --quiet; then
            echo "本次没有可提交的内容"
          else
            git commit -m "chore(ai-news): 自动生成 AI 新资讯文章与配图素材"
            git push
          fi
